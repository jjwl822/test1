<!doctype html><html><head><script src="/games/wv-fix.js?v=3"></script><script>if(navigator.maxTouchPoints>0||"ontouchstart" in window)document.documentElement.classList.add("touch")</script><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>루오와 재능 도둑</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Nanum+Gothic+Coding:wght@400;700&family=Silkscreen&display=swap">
<style>
/* Layout: one handheld-console column. Game screen on top, touch pad below (or beside it in landscape). One deliberate warm-night palette, no theme switch. */
:root{
  --night:#0d0b1c;
  --panel:#141238;
  --line:#f0dfb4;
  --gold:#f5c84c;
  --text:#f6ecd6;
  --dim:#9a96c8;
  --hp:#63d06f;
  --mp:#5aa8f0;
  --bad:#ef6a5a;
  --r1:#f2eee4;
  --r2:#62b4ff;
  --r3:#c993ff;
  --r4:#ffd24a;
  --f-display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Nanum Gothic Coding","Apple SD Gothic Neo","Malgun Gothic",monospace;
  --f-num:"Silkscreen","Courier New",monospace;
  --fs:13px;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  box-sizing:border-box;min-height:100%;margin:0;
  background:
    radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),
    radial-gradient(1px 1px at 78% 9%,#fff6 50%,transparent 51%),
    radial-gradient(1px 1px at 64% 72%,#fff5 50%,transparent 51%),
    radial-gradient(1px 1px at 28% 84%,#fff4 50%,transparent 51%),
    radial-gradient(120% 80% at 50% 0%,#24183f 0%,var(--night) 60%);
  background-color:var(--night);
  color:var(--text);font-family:var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overflow-x:hidden;
}
.console{
  display:grid;justify-items:center;align-items:center;align-content:center;gap:14px;
  grid-template-columns:1fr 1fr;
  grid-template-areas:"frame frame" "padl padr" "keys keys";
  max-width:820px;margin:0 auto;min-height:calc(100dvh - 24px);
}
.frame{
  grid-area:frame;position:relative;
  width:min(100%,800px,calc((100dvh - 64px) * 240 / 208));
  aspect-ratio:240/208;max-width:100%;
  background:#000;border-radius:3px;overflow:hidden;
  box-shadow:0 0 0 2px #3a2f63,0 0 0 6px #08070f,0 0 0 8px #4a3570,0 20px 50px #0009;
  touch-action:none;
}
#screen{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.ui{position:absolute;inset:0;font-size:var(--fs);line-height:1.5;pointer-events:none}
.ui > *{pointer-events:auto}

/* windows */
.win{position:absolute;z-index:2;box-sizing:border-box;background:#110f30;color:var(--text);
  border:2px solid var(--line);outline:2px solid #05040e;border-radius:4px;box-shadow:inset 0 0 0 2px #2e2a6e;padding:.4em .7em}
.win.dim{opacity:.55}
.win.scroll{overflow-y:auto;overscroll-behavior:contain}
.win h3{margin:0 0 .2em;font:400 1.05em/1.3 var(--f-display);color:var(--gold);letter-spacing:.02em}
.item{display:flex;justify-content:space-between;align-items:baseline;gap:.8em;padding-left:1.1em;position:relative;cursor:pointer;white-space:nowrap}
.item .l{overflow:hidden;text-overflow:ellipsis}
.item .r{font-family:var(--f-num);font-size:.8em;color:var(--dim);flex:none}
.item.sel::before{content:"";position:absolute;left:.1em;top:50%;transform:translateY(-50%);
  border-left:.55em solid var(--gold);border-top:.35em solid transparent;border-bottom:.35em solid transparent;animation:nudge .7s steps(2) infinite}
.item.off{opacity:.45}
.item.sel .l{filter:brightness(1.15)}
.r1 .l,.c1{color:var(--r1)} .r2 .l,.c2{color:var(--r2)} .r3 .l,.c3{color:var(--r3)} .r4 .l,.c4{color:var(--r4)}
@keyframes nudge{50%{transform:translate(2px,-50%)}}
.empty{color:var(--dim)}
.kv{display:flex;justify-content:space-between;gap:1em}
.kv b{font-family:var(--f-num);font-weight:400;font-size:.85em;color:var(--gold)}
.muted{color:var(--dim)}
.up{color:var(--hp)}.down{color:var(--bad)}
.small{font-size:.85em}

.w-main{top:3%;right:3%;width:34%}
.w-gold{right:3%;bottom:3%;width:34%}
.w-side{top:3%;left:3%;width:58%;max-height:68%}
.w-info{left:3%;right:3%;bottom:3%;min-height:3.4em}
.w-wide{top:3%;left:3%;right:3%;max-height:72%}
.w-full{top:3%;left:3%;right:3%;bottom:3%}
.w-choice{right:3%;bottom:calc(3% + 5.2em);min-width:30%;z-index:4}
.w-center{left:50%;top:50%;transform:translate(-50%,-50%);min-width:56%}

/* dialog */
.dlg{left:3%;right:3%;bottom:3%;min-height:4.9em;z-index:3;padding:.5em .8em .6em}
.dlg-name{position:absolute;top:-1.15em;left:.6em;background:var(--panel);border:2px solid var(--line);border-radius:3px;padding:0 .5em;font:400 .95em/1.5 var(--f-display);color:var(--gold)}
.dlg-text{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.dlg-more{position:absolute;right:.6em;bottom:.15em;color:var(--gold);font-size:.8em;animation:bob .8s steps(2) infinite}
@keyframes bob{50%{transform:translateY(2px)}}
.toast{top:3%;left:50%;transform:translateX(-50%);z-index:4;white-space:nowrap;font-size:.92em;padding:.25em .8em;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.banner{position:absolute;z-index:4;top:17%;left:50%;transform:translateX(-50%);font:400 1.35em/1.2 var(--f-display);color:#fff;letter-spacing:.06em;white-space:nowrap;
  text-shadow:0 2px 0 #000,0 0 8px #000;animation:bannerIn 2.4s ease forwards;pointer-events:none}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-6px)}15%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.fade{position:absolute;inset:0;background:#000;opacity:0;z-index:10;pointer-events:none}
.fade.white{background:#fff}

/* story */
.story{position:absolute;inset:0;z-index:11;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7em;padding:8%;box-sizing:border-box;text-align:center}
.story p{margin:0;font-size:1.02em;line-height:1.7;opacity:0;transition:opacity .9s;word-break:keep-all;max-width:30em}
.story p.on{opacity:1}
.story .ch{font:400 1em/1 var(--f-num);letter-spacing:.2em;color:var(--gold)}
.story .ct{font:400 2.1em/1.2 var(--f-display);color:#fff}
.story .hint{position:absolute;bottom:5%;font-size:.8em;color:var(--dim);animation:bob 1s steps(2) infinite}
.story .stat{display:grid;grid-template-columns:auto auto;gap:.15em 1.4em;font-size:.95em;opacity:0;transition:opacity .9s}
.story .stat.on{opacity:1}
.story .stat span:nth-child(odd){color:var(--dim);text-align:right}
.story .stat span:nth-child(even){text-align:left;font-family:var(--f-num);font-size:.9em;color:var(--gold)}

/* title */
.title{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.title .logo{margin-top:30%;text-align:center}
.title .logo small{display:block;font:400 .66em/1 var(--f-num);letter-spacing:.3em;color:var(--gold);margin-bottom:.6em}
.title .logo h1{margin:0;font:400 2.6em/1 var(--f-display);color:#fff;letter-spacing:.03em;text-shadow:0 3px 0 #8a2f2a,0 0 18px #f5c84c66}
.title .logo p{margin:.5em 0 0;font-size:.85em;color:#efe0f5}
.w-title{left:50%;bottom:7%;transform:translateX(-50%);min-width:44%}

/* battle */
.b-msg{top:3%;left:3%;right:3%;min-height:2.1em;z-index:3;word-break:keep-all}
.b-cmd{left:3%;bottom:3%;width:37%;z-index:3}
.b-sub{left:3%;bottom:3%;width:58%;max-height:58%;z-index:4}
.b-party{right:3%;bottom:3%;width:57%;padding:.35em .6em;display:grid;gap:.25em}
.pm{position:relative;padding-left:.5em;border-left:3px solid transparent;line-height:1.3}
.pm.act{border-left-color:var(--gold)}
.pm.ko{color:#7a7fa8}
.pm.hit{animation:hit .3s steps(2) 2}
@keyframes hit{50%{background:#ef6a5a55}}
.pm-top{display:flex;gap:.5em;align-items:baseline}
.pm-top b{font:400 1.02em/1.3 var(--f-display)}
.lv{font:400 .72em/1 var(--f-num);color:var(--dim)}
.tag{font-size:.75em;color:#c88cff;border:1px solid #c88cff;padding:0 .3em;border-radius:2px;line-height:1.3}
.tag.ko{color:var(--bad);border-color:var(--bad)}
.bar{height:.38em;background:#2a275c;border:1px solid #05040e;margin:.18em 0 .1em}
.bar i{display:block;height:100%;background:var(--hp)}
.bar.low i{background:var(--bad)}
.nums{display:flex;justify-content:space-between;gap:.6em;font:400 .72em/1.3 var(--f-num);color:#d3d0f5}
.nums .m{color:var(--mp)}

/* status & sets */
.st-grid{display:grid;grid-template-columns:1fr 1fr;gap:.05em 1.2em}
.st-grid .kv span{color:var(--dim)}
.sec{margin-top:.35em;padding-top:.3em;border-top:1px dashed #3d3884}
.set-line{font-size:.85em;line-height:1.45}
.set-line .on{color:var(--hp)}
.set-line .off{color:#6a6798}
.eqrow{display:grid;grid-template-columns:3.6em 1fr;gap:.6em;font-size:.92em}
.eqrow span:first-child{color:var(--dim)}

/* minigame */
.mg{min-width:76%;text-align:center;z-index:5}
.mg .oven{position:relative;height:1.6em;margin:.6em .2em .4em;border:2px solid #05040e;border-radius:3px;
  background:linear-gradient(90deg,#f3e3bf 0%,#e9c27a 30%,#c8812e 55%,#6a3410 80%,#1d0b04 100%);overflow:hidden}
.mg .zone{position:absolute;top:0;bottom:0;background:#fff5;border-left:2px solid #fff;border-right:2px solid #fff}
.mg .zone.p{background:#ffd24acc;border-color:#fff8c8;box-shadow:0 0 8px #ffd24a}
.mg .mark{position:absolute;top:-3px;bottom:-3px;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 0 2px #05040e}
.mg .row{display:flex;justify-content:center;gap:.35em;font-size:1.25em;min-height:1.4em}
.mg .res{font:400 1.25em/1.4 var(--f-display);min-height:1.4em}
.mg .res.p{color:var(--gold)} .mg .res.g{color:var(--hp)} .mg .res.b{color:var(--bad)}
.mg .help{font-size:.82em;color:var(--dim)}

/* graphics: icons, portraits, paper doll */
.dlg.has-face{padding-left:5.1em}
.dlg-face{position:absolute;left:.5em;top:.5em;width:4.1em;image-rendering:pixelated;background:radial-gradient(circle at 50% 35%,#4a4398,#1d1a50);border:2px solid var(--line);border-radius:4px}
.dlg.has-face .dlg-name{left:5em}
.item .l{display:inline-flex;align-items:center;gap:.4em;min-width:0}
.item .l > span:last-child{overflow:hidden;text-overflow:ellipsis}
.icobox{display:inline-grid;place-items:center;width:1.55em;height:1.55em;border:2px solid #3e3a80;border-radius:3px;background:#1b184a;flex:none;box-sizing:border-box}
.icobox .ico{width:1.2em;height:1.2em;margin:0}
.rb1{border-color:#8e8aa8}.rb2{border-color:var(--r2)}.rb3{border-color:var(--r3);box-shadow:0 0 6px #c993ff66}.rb4{border-color:var(--r4);box-shadow:0 0 8px #ffd24a88}
.ico{width:1.2em;height:1.2em;image-rendering:pixelated;vertical-align:-.25em;margin-right:.3em}
.pm{display:grid;grid-template-columns:2.4em 1fr;gap:.45em;align-items:center}
.pm .face{width:2.4em;image-rendering:pixelated;background:radial-gradient(circle at 50% 35%,#4a4398,#1d1a50);border:1px solid #5a55a8;border-radius:3px}
.pm.ko .face{filter:grayscale(1) brightness(.6)}
.pm.healfx{animation:healfx .8s ease}
@keyframes healfx{30%{background:#63d06f44;box-shadow:inset 0 0 0 1px #63d06f}}
.pm-body{min-width:0}
.doll{display:grid;grid-template-columns:auto 1fr;gap:.9em;align-items:start}
.figbox{display:grid;justify-items:center;gap:.4em}
.fig{width:5.4em;image-rendering:pixelated;background:radial-gradient(circle at 50% 40%,#4a4398 0%,#1d1a50 75%);border:2px solid var(--line);border-radius:6px;padding:.3em .3em 0}
.stt{display:grid;grid-template-columns:auto auto;gap:0 .7em;font-size:.82em}
.stt span{color:var(--dim)} .stt b{font:400 .9em/1.5 var(--f-num);color:var(--gold);text-align:right}
.slotlist .item{padding-block:.12em}
.doll-win{padding-bottom:4.6em}
.eq2{display:grid;grid-template-columns:auto 1fr;gap:.8em;align-items:start}
.eqr{min-width:0;display:grid;gap:.25em}
.bagh{display:flex;justify-content:space-between;align-items:baseline;font:400 .95em/1.4 var(--f-display);color:var(--gold);border-top:1px dashed #3d3884;padding-top:.25em;margin-top:.1em}
.bag{display:flex;flex-wrap:wrap;gap:.35em;max-height:5.3em;overflow-y:auto;padding:.2em .15em}
.tile{position:relative;width:2.2em;height:2.2em;display:grid;place-items:center;border:2px solid #3e3a80;border-radius:3px;background:#1b184a;cursor:pointer;box-sizing:border-box;flex:none}
.tile img{width:1.6em;height:1.6em;image-rendering:pixelated}
.tile.sel{outline:2px solid var(--gold);outline-offset:1px;background:#2c2770}
.tile .n{position:absolute;right:1px;bottom:-2px;font:400 .55em/1 var(--f-num);color:#fff;text-shadow:0 1px 0 #000}
.tile .e{position:absolute;left:1px;top:0;font:400 .55em/1 var(--f-num);color:var(--gold);text-shadow:0 1px 0 #000}
.tile.better::after{content:"▲";position:absolute;right:0;top:-2px;font-size:.55em;color:var(--hp);text-shadow:0 1px 0 #000}
.slotlist .item.tgt{background:#2c277088;border-radius:3px}
.slotlist .item.tgt .r{color:var(--gold)}
.setsum{font-size:.72em;color:var(--dim);text-align:center;line-height:1.3}
.setsum b{font-weight:400;color:var(--gold)}
.setsum span{display:inline-block;min-width:1.1em;margin-left:.15em;border:1px solid #3e3a80;border-radius:2px;font-family:var(--f-num)}
.setsum .on{color:var(--hp);border-color:var(--hp)} .setsum .off{color:#6a6798}
.eqwin .fig{width:4.6em}
.eqwin{overflow-y:auto}
.eqwin .stt{grid-template-columns:auto auto auto auto;gap:0 .45em}
.eqwin .slotlist .item{padding-block:.06em}
.skrow{display:flex;flex-wrap:wrap;gap:.3em .9em}
.sk{display:inline-flex;align-items:center;gap:.25em}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.4em,1fr));gap:.4em;margin-top:.3em}
.dexcard{display:grid;justify-items:center;text-align:center;gap:.1em;padding:.35em .2em;background:#1b184a;border:1px solid #3e3a80;border-radius:4px}
.dexcard img{width:3.2em;image-rendering:pixelated}
.dexcard b{font:400 .95em/1.2 var(--f-display)} .dexcard span{font-size:.72em;color:var(--dim)}
.dexcard.unk img{filter:brightness(0) opacity(.5)}
.eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9em,1fr));gap:.3em .6em;margin-top:.2em}
.eqcard{display:flex;align-items:center;gap:.4em;font-size:.9em;min-width:0}
.eqcard.unk .ico{filter:brightness(0) opacity(.45)}

/* chapter 2: rhythm dance, fishing, shadow */
.mg.dance{min-width:0;width:min(17em,92%)}
.mg .meta{display:flex;justify-content:space-between;font-size:.85em;color:var(--gold);padding:0 .3em;min-height:1.3em}
.dz{position:relative;height:10.5em;width:13.5em;max-width:100%;margin:.3em auto .2em;background:linear-gradient(#0b0a24,#1c1646);border:2px solid #05040e;border-radius:4px;overflow:hidden;touch-action:none}
.dz .ln{position:absolute;top:0;bottom:0;width:25%;border-right:1px solid #2a266088}
.dz .hit{position:absolute;left:0;right:0;bottom:1.7em;height:2px;background:#f5c84ccc;box-shadow:0 0 6px #f5c84c}
.dz .rc{position:absolute;bottom:.1em;width:25%;text-align:center;font-size:1.3em;line-height:1.2;color:#6a6798;cursor:pointer}
.dz .rc.on{color:#fff;text-shadow:0 0 8px #f5c84c}
.dz .nt{position:absolute;top:0;width:25%;text-align:center;font-size:1.35em;line-height:1.1;will-change:transform;text-shadow:0 1px 0 #000}
.dz .nt.l0{color:#f070a0}.dz .nt.l1{color:#62b4ff}.dz .nt.l2{color:#63d06f}.dz .nt.l3{color:#f5c84c}
.dz .jd{position:absolute;left:0;right:0;top:34%;text-align:center;font:400 1.25em/1 var(--f-display);pointer-events:none;text-shadow:0 2px 0 #000}
.dz .jd.p{color:var(--gold)} .dz .jd.g{color:var(--hp)} .dz .jd.b{color:var(--bad)}
.pond{position:relative;height:5.5em;margin:.4em 0;border:2px solid #05040e;border-radius:4px;background:linear-gradient(#6aa8e0,#3a6fb4);overflow:hidden}
.pond .wv{position:absolute;left:8%;right:8%;height:2px;background:#a8d0f466;border-radius:2px}
.pond .bob{position:absolute;left:50%;top:38%;width:.85em;height:1.15em;margin-left:-.42em;background:linear-gradient(#e04040 50%,#fff 50%);border:2px solid #05040e;border-radius:50% 50% 45% 45%}
.pond .bob.dip{top:60%;transition:top .1s}
.pond .exc{position:absolute;left:50%;top:4%;transform:translateX(-50%);font:400 1.7em/1 var(--f-display);color:#ffd24a;text-shadow:0 2px 0 #000}
.reel{position:relative;height:1.5em;margin:.55em .2em .3em;border:2px solid #05040e;border-radius:3px;background:#1d2a4a;overflow:hidden}
.reel .zone{position:absolute;top:0;bottom:0;background:#63d06f99;border-left:2px solid #c8ffd0;border-right:2px solid #c8ffd0}
.reel .mark{position:absolute;top:-3px;bottom:-3px;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 0 2px #05040e}
.shadowfig{position:absolute;z-index:2;left:50%;top:6%;width:38%;transform:translateX(-50%);image-rendering:pixelated;opacity:.92;filter:drop-shadow(0 0 10px #ff3030);animation:shfloat 2.4s ease-in-out infinite;pointer-events:none}
@keyframes shfloat{50%{transform:translate(-50%,-6px)}}
.b-party.three{gap:.12em;padding:.25em .5em}
.b-party.three .pm .face{width:2em}
.b-party.three .pm{grid-template-columns:2em 1fr;gap:.35em}
.b-party.three .bar{margin:.1em 0 .05em}
.fishgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5em,1fr));gap:.4em;margin-top:.3em}

/* chapter 3 */
.sg{display:flex;align-items:center;justify-content:center;gap:.8em;min-height:5.2em;margin:.3em 0}
.sgf{width:3.6em;image-rendering:pixelated;background:radial-gradient(circle at 50% 40%,#4a4398,#1d1a50);border:2px solid var(--line);border-radius:4px;transition:transform .08s}
.sgf.hit{transform:translateX(-6px) scale(1.08)}
.sgc{font:400 1.35em/1.2 var(--f-display);color:var(--dim);min-width:6.5em;text-align:left}
.sgc.on{color:#fff;text-shadow:0 0 8px #ef6a5a}
.b-party.four{grid-template-columns:1fr 1fr;gap:.15em .45em;padding:.25em .4em}
.b-party.four .pm{grid-template-columns:1.5em 1fr;gap:.25em;padding-left:.3em}
.b-party.four .pm .face{width:1.5em}
.b-party.four .pm-top b{font-size:.88em}
.b-party.four .lv{display:none}
.b-party.four .nums{font-size:.6em;flex-direction:column;gap:0}
.b-party.four .tag{font-size:.6em}
/* touch pad */
.padl,.padr{display:none}
.keys{grid-area:keys;margin:0;font-size:12.5px;color:var(--dim);text-align:center;letter-spacing:.02em}
.keys kbd{font-family:var(--f-num);font-size:.85em;color:var(--text);background:#1f1b50;border:1px solid #3d3884;border-bottom-width:2px;border-radius:3px;padding:0 .35em}
@media (hover:none) and (pointer:coarse){
  .keys{display:none}
  .padl,.padr{display:flex}
  .frame{width:min(100%,800px,calc((100dvh - 230px) * 240 / 208));min-width:min(100%,280px)}
}
.padl{grid-area:padl;justify-self:start}
.padr{grid-area:padr;justify-self:end;align-items:center;gap:12px}

<script>
(()=>{

/* =========================================================

const TS=16, VW=15, VH=13, W=VW*TS, H=VH*TS, STEP_MS=150, MOB_MS=260;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function josa(w,pair){
  const [a,b]=pair.split('/'); const c=w.charCodeAt(w.length-1);
  if(c>=48&&c<=57) return w+('2459'.includes(w[w.length-1])?b:(pair==='으로/로'&&'78'.includes(w[w.length-1])?'로':a));
  if(c<0xAC00||c>0xD7A3) return w+b;
  const jong=(c-0xAC00)%28;
  if(pair==='으로/로') return w+((jong===0||jong===8)?'로':'으로');
  return w+(jong?a:b);
}
const J=josa;
const fmtTime=ms=>{const m=Math.floor(ms/60000);return Math.floor(m/60)+':'+String(m%60).padStart(2,'0');};
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}

/* save backup on the family server: survives reinstalling the app, carries over between app and browser.
   SKEY-at = when this phone last saved; whichever copy is newer wins. */
const CLOUD='/api/games/luo/save';
let cloudTimer=0;
function savedAt(){ return +localStorage.getItem(SKEY+'-at')||0; }
function cloudPush(){ clearTimeout(cloudTimer); cloudTimer=setTimeout(cloudFlush,1500); }
function cloudFlush(){
  clearTimeout(cloudTimer); cloudTimer=0;
  try{ const s=localStorage.getItem(SKEY); if(!s) return;
    fetch(CLOUD+'?at='+savedAt(),{method:'PUT',credentials:'same-origin',headers:{'content-type':'text/plain'},body:s,keepalive:s.length<60000}).catch(()=>{});
  }catch(e){}
}
async function cloudPull(){
  try{
    // A save from before the backup existed counts as new, so it's uploaded rather than replaced.
    if(localStorage.getItem(SKEY)&&!savedAt()) localStorage.setItem(SKEY+'-at',String(Date.now()));
    const ac=new AbortController(),t=setTimeout(()=>ac.abort(),5000);
    const r=await fetch(CLOUD,{credentials:'same-origin',signal:ac.signal}); clearTimeout(t);
    if(!r.ok) return;
    const c=await r.json(),local=localStorage.getItem(SKEY);
    if(c.data&&(!local||c.savedAt>savedAt())){ localStorage.setItem(SKEY,c.data); localStorage.setItem(SKEY+'-at',String(c.savedAt)); }
    else if(local&&c.savedAt<savedAt()) cloudFlush();
  }catch(e){}
}
addEventListener('visibilitychange',()=>{ if(document.hidden&&cloudTimer) cloudFlush(); });

function playBgm(name){

function stopBgm(){ if(bgm.timer){ clearInterval(bgm.timer); bgm.timer=null; } }
function startBgm(){
  if(!musicOn||!AC||!bgm.want||!MUSIC[bgm.want]) return;
  stopBgm();
  const m=MUSIC[bgm.want], eighth=60/m.bpm/2, t0=AC.currentTime+.08;
  bgm.v=[{n:m.lead,i:0,t:t0,type:'square',vol:.03},{n:m.bass,i:0,t:t0,type:'triangle',vol:.07}];
  bgm.timer=setInterval(()=>{
    if(!AC) return;
    for(const v of bgm.v){
      while(v.t<AC.currentTime+.25){
        const [f,d]=v.n[v.i]; const len=d*eighth;
        if(f>0){ const o=AC.createOscillator(), g=AC.createGain(); o.type=v.type; o.frequency.value=f;
          g.gain.setValueAtTime(v.vol,v.t); g.gain.setValueAtTime(v.vol,v.t+len*.7); g.gain.exponentialRampToValueAtTime(.0001,v.t+len*.95);
          o.connect(g).connect(musicGain); o.start(v.t); o.stop(v.t+len); }
        v.t+=len; v.i=(v.i+1)%v.n.length;
      }
    }
  },60);
}

/* 작은 붓: 원·다각형으로 그리고 테두리를 두른다 */
function paint(w,h,fn,ol){
  const C=new Array(w*h).fill(null);
  const P={w,h,
    set(x,y,c){ x=Math.floor(x); y=Math.floor(y); if(!c||x<0||y<0||x>=w||y>=h) return; C[y*w+x]=c; },
    get(x,y){ return x<0||y<0||x>=w||y>=h?null:C[y*w+x]; },
    rect(x,y,ww,hh,c){ for(let j=0;j<hh;j++) for(let i=0;i<ww;i++) P.set(x+i,y+j,c); },
    ell(cx,cy,rx,ry,c,f){ for(let y=Math.floor(cy-ry);y<=cy+ry;y++) for(let x=Math.floor(cx-rx);x<=cx+rx;x++){ const dx=(x+.5-cx)/rx, dy=(y+.5-cy)/ry; if(dx*dx+dy*dy<=1&&(!f||f(x,y))) P.set(x,y,c); } },
    poly(pts,c){ let y0=99,y1=-1; for(const p of pts){ y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]); }
      for(let y=Math.floor(y0);y<=y1;y++){ const yc=y+.5, xs=[]; for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; if((a[1]<=yc&&b[1]>yc)||(b[1]<=yc&&a[1]>yc)) xs.push(a[0]+(yc-a[1])/(b[1]-a[1])*(b[0]-a[0])); }
        xs.sort((p,q)=>p-q); for(let k=0;k+1<xs.length;k+=2) for(let x=Math.ceil(xs[k]-.5);x<xs[k+1]-.5;x++) P.set(x,y,c); } },
    line(x0,y0,x1,y1,c){ const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))||1; for(let i=0;i<=n;i++) P.set(Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),c); },
    recolor(pred,c){ for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const v=C[y*w+x]; if(v&&pred(x,y,v)) C[y*w+x]=c; } }
  };
  fn(P);
  if(ol!==false){ const add=[]; for(let y=0;y<h;y++) for(let x=0;x<w;x++){ if(P.get(x,y)) continue; if(P.get(x+1,y)||P.get(x-1,y)||P.get(x,y+1)||P.get(x,y-1)) add.push([x,y]); } for(const [x,y] of add) P.set(x,y,ol||'#2b1d2f'); }
  const cv=mk(w,h), x=cv.getContext('2d'); for(let i=0;i<w*h;i++) if(C[i]){ x.fillStyle=C[i]; x.fillRect(i%w,Math.floor(i/w),1,1); } return cv;
}

   초상화 생성기 (64×64 도트 상반신)
   ========================================================= */
const PW=64, PH=64;
class PBuf{
  constructor(){ this.c=new Array(PW*PH).fill(null); this.t=new Array(PW*PH).fill(null); }
  set(x,y,c,tag){ x=Math.floor(x); y=Math.floor(y); if(!c||x<0||y<0||x>=PW||y>=PH) return; const i=y*PW+x; this.c[i]=c; this.t[i]=tag||null; }
  get(x,y){ return (x<0||y<0||x>=PW||y>=PH)?null:this.c[y*PW+x]; }
  tag(x,y){ return (x<0||y<0||x>=PW||y>=PH)?null:this.t[y*PW+x]; }
  rect(x,y,w,h,c,tag){ for(let j=0;j<h;j++) for(let i=0;i<w;i++) this.set(x+i,y+j,c,tag); }
  ell(cx,cy,rx,ry,c,tag,f){ for(let y=Math.floor(cy-ry);y<=cy+ry;y++) for(let x=Math.floor(cx-rx);x<=cx+rx;x++){ const dx=(x+.5-cx)/rx, dy=(y+.5-cy)/ry; if(dx*dx+dy*dy<=1&&(!f||f(x,y))) this.set(x,y,c,tag); } }
  poly(pts,c,tag,f){
    let y0=99,y1=-1; for(const p of pts){ y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]); }
    for(let y=Math.floor(y0);y<=y1;y++){ const yc=y+.5, xs=[];
      for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; if((a[1]<=yc&&b[1]>yc)||(b[1]<=yc&&a[1]>yc)) xs.push(a[0]+(yc-a[1])/(b[1]-a[1])*(b[0]-a[0])); }
      xs.sort((p,q)=>p-q);
      for(let k=0;k+1<xs.length;k+=2) for(let x=Math.ceil(xs[k]-.5);x<xs[k+1]-.5;x++) if(!f||f(x,y)) this.set(x,y,c,tag);
    }
  }
  line(x0,y0,x1,y1,c,tag){ const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))||1; for(let i=0;i<=n;i++) this.set(Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),c,tag); }
  grid(x,y,rows,pal,mirror,tag){ rows.forEach((r,j)=>{ const s=mirror?[...r].reverse():[...r]; s.forEach((ch,i)=>{ if(ch==='.'||ch===' ') return; const col=pal[ch]; if(col) this.set(x+i,y+j,col,tag); }); }); }
  recolor(pred,col){ for(let y=0;y<PH;y++) for(let x=0;x<PW;x++){ const i=y*PW+x; if(this.c[i]&&pred(x,y,this.t[i],this.c[i])) this.c[i]=col; } }
  edge(tagA,tagB,col){ // tagA 픽셀 중 tagB와 맞닿은 곳을 col로
    const hit=[]; for(let y=0;y<PH;y++) for(let x=0;x<PW;x++){ if(this.tag(x,y)!==tagA) continue;
      if([[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>tagB.includes(this.tag(x+dx,y+dy)))) hit.push(y*PW+x); }
    for(const i of hit) this.c[i]=col;
  }
  outline(col){ const add=[]; for(let y=0;y<PH;y++) for(let x=0;x<PW;x++){ if(this.get(x,y)) continue;
      if(this.get(x+1,y)||this.get(x-1,y)||this.get(x,y+1)||this.get(x,y-1)) add.push([x,y]); }
    for(const [x,y] of add) this.set(x,y,col,'ol'); }
  canvas(){ const cv=mk(PW,PH), x=cv.getContext('2d'); for(let i=0;i<PW*PH;i++) if(this.c[i]){ x.fillStyle=this.c[i]; x.fillRect(i%PW,Math.floor(i/PW),1,1); } return cv; }
}

const POR_CACHE={};
function porKey(name){ if(name==='루오'&&typeof F!=='undefined'&&F.mage) return '루오M'; if(name==='파프리카독'&&typeof F!=='undefined'&&F.pdReal&&!F.councilN) return '파프리카독R'; return name; }
function portraitCanvas(name,ex,v){
  const key=porKey(name)+'|'+ex+'|'+(v||''); if(POR_CACHE[key]) return POR_CACHE[key];
  let cv;
  if((name==='파프리카독'&&porKey(name)!=='파프리카독R')||name==='수정 속 목소리') cv=shadowDog(ex,v);
  else {
    const c=POR[porKey(name)]; if(!c) return null;
    const pb=new PBuf();
    if(c.hairFn) c.hairFn(pb,c);
    // 얼굴은 뒷머리 위, 앞머리 아래
    const back=pb.c.slice(), backT=pb.t.slice();
    const pb2=new PBuf(); pb2.c=back; pb2.t=backT;
    // 뒷머리만 남기고 앞머리는 따로
    const front=new PBuf(); for(let i=0;i<PW*PH;i++){ if(pb.t[i]==='hair'){ front.c[i]=pb.c[i]; front.t[i]='hair'; pb2.c[i]=null; pb2.t[i]=null; } }
    drawBase(pb2,c);
    const fx=drawFace(pb2,c,ex,v);
    for(let i=0;i<PW*PH;i++) if(front.c[i]){ pb2.c[i]=front.c[i]; pb2.t[i]='hair'; }
    if(c.accFn) c.accFn(pb2,c);
    if(c.hatFn) c.hatFn(pb2,c);
    // 눈썹은 앞머리 위에 다시 (표정이 잘 보이도록)
    if(!c.noBrow){ const E=EXPR[ex]||EXPR.n, ey=c.eyeY||30, by=ey-4+(c.browY||0)+(BROW_DY[E.b]||0); gridLR(pb2,BROWS[E.b],by,20,36,{b:c.brow||c.hairD},'brow'); }
    finish(pb2,c);
    porFx(pb2,c,fx);
    cv=pb2.canvas();
  }
  return POR_CACHE[key]=cv;
}
function portraitURL(name,ex,v){
  if(name==='피망'||name==='하얀 강아지') return pimanURL(ex,v);
  const key='u|'+porKey(name)+'|'+ex+'|'+(v||''); if(POR_CACHE[key]) return POR_CACHE[key];
  const cv=portraitCanvas(name,ex,v); if(!cv) return null;
  return POR_CACHE[key]=cv.toDataURL();
}

  return new Promise(res=>{ const t0=performance.now(); const step=now=>{ const p=Math.min(1,(now-t0)/ms); fn(p,now); if(p<1) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); }); }
const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2, easeIn=p=>p*p, easeOut=p=>1-(1-p)*(1-p);

/* 1. 소용돌이 깨짐 (일반 전투 진입) */
async function tSwirlOut(){
  tOn();
  for(let i=0;i<2;i++){ tctx.fillStyle='#fff'; tctx.globalAlpha=.85; tctx.fillRect(0,0,W,H); tctx.globalAlpha=1; await sleep(70); tctx.clearRect(0,0,W,H); await sleep(60); }
  const S=snap(), B=10, cx=W/2, cy=H/2, blocks=[];
  for(let y=0;y<H;y+=B) for(let x=0;x<W;x+=B){ const dx=x+B/2-cx, dy=y+B/2-cy; blocks.push({x,y,r:Math.hypot(dx,dy),a:Math.atan2(dy,dx),j:Math.random()}); }
  sfx('swirl');
  await tAnim(620,p=>{
    tctx.fillStyle='#000'; tctx.fillRect(0,0,W,H);
    const q=easeIn(p);
    for(const b of blocks){
      const k=Math.max(0,Math.min(1,q*1.5-b.j*.35)); if(k>=1) continue;
      const a=b.a+k*(2.4+b.r/90), r=b.r*(1-k*.85), s=1-k;
      const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r, sz=B*s;
      tctx.save(); tctx.translate(Math.round(x),Math.round(y)); tctx.rotate(k*3+b.j); tctx.drawImage(S,b.x,b.y,B,B,-sz/2,-sz/2,sz,sz); tctx.restore();
    }
  });
  handCover();
}

function irisDraw(cx,cy,r,col){
  tctx.clearRect(0,0,W,H); tctx.fillStyle=col||'#000';
  for(let y=0;y<H;y+=2){ const dy=y+1-cy; if(Math.abs(dy)>=r){ tctx.fillRect(0,y,W,2); continue; }
    const hw=Math.round(Math.sqrt(r*r-dy*dy)/2)*2; tctx.fillRect(0,y,Math.max(0,cx-hw),2); tctx.fillRect(cx+hw,y,W-(cx+hw),2); }
}

async function tScrollOut(){
  tOn(); sfx('magic'); const [x,y]=playerScreen(); const st0=performance.now();

  await tAnim(1000,(p,now)=>{ tctx.clearRect(0,0,W,H); const t=now-st0;
    // 빛기둥
    const bw=Math.round(4+p*10); const g=tctx.createLinearGradient(x-bw,0,x+bw,0); g.addColorStop(0,'rgba(255,250,210,0)'); g.addColorStop(.5,`rgba(255,250,210,${.75*p})`); g.addColorStop(1,'rgba(255,250,210,0)');
    tctx.fillStyle=g; tctx.fillRect(x-bw,0,bw*2,y+8);
    const rg=tctx.createRadialGradient(x,y+4,1,x,y+4,26+p*16); rg.addColorStop(0,`rgba(255,250,210,${.8*p})`); rg.addColorStop(1,'rgba(255,250,210,0)'); tctx.fillStyle=rg; tctx.fillRect(0,0,W,H);

    for(const q of P){ if(t<q.d) continue; const tt=(t-q.d)/1000, a=q.a+tt*4, r=q.r*(1-p*.5), yy=y+6-tt*q.sp*1.6, xx=x+Math.cos(a)*r;
      tctx.globalAlpha=Math.max(0,1-tt*.9)*(Math.sin(a)>0?1:.55); star(xx,yy,q.c,q.big); }

    for(let y=0;y<Ht;y++){ let acc=0; for(let x=-r;x<=r;x++) acc+=src[y*Wd+clamp(x,0,Wd-1)];
      for(let x=0;x<Wd;x++){ t[y*Wd+x]=acc/n; acc+=src[y*Wd+clamp(x+r+1,0,Wd-1)]-src[y*Wd+clamp(x-r,0,Wd-1)]; } }

      for(let y=0;y<Ht;y++){ o[y*Wd+x]=acc/n; acc+=t[clamp(y+r+1,0,Ht-1)*Wd+x]-t[clamp(y-r,0,Ht-1)*Wd+x]; } }
    return o; };

async function enemyAct(e){

}

function useItemOn(id,m){

function statDiff(m,id,slot){
  const cur=st(m); const old=m.eq[slot]; m.eq[slot]=id; const nw=st(m); m.eq[slot]=old;
  const lab={atk:'공격',def:'방어',mag:'마력',spd:'민첩',hp:'HP',mp:'MP'}; const parts=[];
  for(const k in lab){ if(nw[k]!==cur[k]) parts.push(`${lab[k]} ${cur[k]}→${nw[k]}`); }
  return parts.join(' · ')||'능력치 변화 없음';
}
function setLines(m,html){
  const c=setCounts(m); const out=[];
  for(const s in c){ const S=SETS[s]; const parts=Object.keys(S.b).map(n=>`<span class="${c[s]>=+n?'on':'off'}">${n}개: ${S.b[n].d}</span>`);
    out.push(html?`<div class="set-line"><b class="c2" style="font-weight:400">${S.name} ${c[s]}/${S.pieces.length}</b><br>${parts.join('<br>')}</div>`:`${S.name} ${c[s]}/${S.pieces.length}`); }
  return out;
}

async function equipScreen(m){
  const w=makeWin('w-full doll-win eqwin'), info=makeWin('w-info'); info.style.zIndex=4;

        <div class="eqr"><div class="slotlist"></div>
          <div class="bagh"><span>가방</span><span class="muted small">${bag.length?'고르면 바로 입어요':''}</span></div>
          <div class="bag">${bag.length?'':'<span class="muted small">입을 수 있는 장비가 가방에 없어요.</span>'}</div></div></div>`;
    const list=w.querySelector('.slotlist');
    slotEls=SLOTS.map(([k,l],i)=>{ const id=m.eq[k]; const r=document.createElement('div'); r.className='item'+(id?' r'+ITEMS[id].r:' muted');
      r.innerHTML=`<span class="l"><span class="icobox rb${id?ITEMS[id].r:0}">${id?`<img class="ico" alt="" src="${icoOf(id)}">`:''}</span><span></span></span><span class="r">${l}</span>`;
      r.querySelector('.l > span:last-child').textContent=id?eqName(id):`${l} 없음`;
      r.addEventListener('click',e=>{ e.stopPropagation(); act({slot:i}); });
      r.addEventListener('pointermove',e=>{ if(e.pointerType==='mouse'&&(focus!=='slot'||si!==i)){ focus='slot'; si=i; upd(); } });
      list.appendChild(r); return r; });
    const bg=w.querySelector('.bag');
    tileEls=bag.map((id,i)=>{ const it=ITEMS[id], t=document.createElement('div'); t.className='tile rb'+it.r+(eqScore(m,id,it.slot)>0?' better':'');
      t.innerHTML=`<img alt="" src="${icoOf(id)}">${G.enh[id]?`<span class="e">+${G.enh[id]}</span>`:''}${cnt(id)>1?`<span class="n">${cnt(id)}</span>`:''}`;
      t.addEventListener('click',e=>{ e.stopPropagation(); act({tile:i}); });
      t.addEventListener('pointermove',e=>{ if(e.pointerType==='mouse'&&(focus!=='inv'||ii!==i)){ focus='inv'; ii=i; upd(); } });
      bg.appendChild(t); return t; });
    upd();
  };
  const cols=()=>{ if(tileEls.length<2) return 1; const y0=tileEls[0].offsetTop; let n=0; for(const t of tileEls){ if(t.offsetTop!==y0) break; n++; } return Math.max(1,n); };
  const upd=()=>{
    const tgt=focus==='inv'&&bag[ii]?SO[ITEMS[bag[ii]].slot]:-1;
    slotEls.forEach((e,k)=>{ e.classList.toggle('sel',focus==='slot'&&k===si); e.classList.toggle('tgt',k===tgt); });
    tileEls.forEach((e,k)=>e.classList.toggle('sel',focus==='inv'&&k===ii));
    if(focus==='slot'){ const id=m.eq[SLOTS[si][0]]; info.textContent=id?itemDesc(id):`${SLOTS[si][1]} 칸이 비어 있다. A를 눌러 장비를 고르자.`; }
    else { const id=bag[ii]; if(id){ tileEls[ii].scrollIntoView({block:'nearest'}); info.textContent=`${eqName(id)} [${RARITY[ITEMS[id].r]}] → ${statDiff(m,id,ITEMS[id].slot)}`; } }
  };
  const wear=id=>{ equipTo(m,id); sfx('buy'); build(); };
  const slotPick=async()=>{
    const slot=SLOTS[si][0];
    const opts=invList().filter(id=>ITEMS[id].slot===slot&&canEquip(m,id));

    w2.remove();
    if(r<0){ upd(); return; }
    if(r===opts.length){ if(m.eq[slot]){ give(m.eq[slot]); m.eq[slot]=null; const ns=st(m); m.hp=Math.min(m.hp,ns.hp); m.mp=Math.min(m.mp,ns.mp); sfx('cancel'); } build(); }
    else wear(opts[r]);

    } else {
      const C=cols();

      else if(a==='down'){ if(ii+C<bag.length){ ii+=C; sfx('cur'); upd(); } else if(Math.floor(ii/C)<Math.floor((bag.length-1)/C)){ ii=bag.length-1; sfx('cur'); upd(); } }
      else if(a==='a'){ wear(bag[ii]); }

    }
  }

const DANCE_LANES=['left','down','up','right'], DANCE_GLYPH=['◀','▼','▲','▶'];
const DANCE_REWARDS=[[55,'dancerband'],[65,'dancervest'],[75,'dancerskirt'],[85,'dancerbell'],[92,'dancebow']];
function laneOfPitch(f,flipL){ const midi=Math.round(12*Math.log2(f/440)+69), pc=((midi%12)+12)%12;
  let l=[0,0,0,1,1,1,2,2,3,3,3,3][pc]; if(midi>=84) l=3; return flipL?3-l:l; }
function danceChart(mode){
  const m=MUSIC.dance, ons=[]; let t=0; for(const [f,d] of m.lead){ if(f>0) ons.push({t,f,d}); t+=d; } const L=t, notes=[];
  for(const o of ons) if(o.t%2===0&&o.d>=2) notes.push({b:o.t,l:laneOfPitch(o.f)});
  if(mode==='lesson') return {notes,loops:1,L};
  for(const o of ons) notes.push({b:L+o.t,l:laneOfPitch(o.f)});
  for(const o of ons){ notes.push({b:2*L+o.t,l:laneOfPitch(o.f,Math.floor(o.t/8)%2===1)}); if(o.d>=4) notes.push({b:2*L+o.t+2,l:(laneOfPitch(o.f)+2)%4}); }
  return {notes,loops:3,L};
}
function tone(f,t,len,type,vol,dest){ const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(vol,t); g.gain.setValueAtTime(vol,t+len*.7); g.gain.exponentialRampToValueAtTime(.0001,t+len*.95); o.connect(g).connect(dest||musicGain); o.start(t); o.stop(t+len); }
function scheduleSong(m,eighth,loops,t0){
  for(const [voice,type,vol] of [[m.lead,'square',.035],[m.bass,'triangle',.08]]){ let t=t0; for(let k=0;k<loops;k++) for(const [f,d] of voice){ const len=d*eighth; if(f>0) tone(f,t,len,type,vol); t+=len; } }
}

  }

  const hitTop=dz.querySelector('.hit').offsetTop;
  let P=0,Gd=0,M=0,combo=0,maxCombo=0,score=0,finished=false;
  const endAt=ns[ns.length-1].at+900;

  const tick=()=>{ if(finished) return; const now=performance.now();
    for(const n of ns){ if(n.done) continue; const dt=n.at-now; if(dt>fall) continue;
      if(!n.el){ n.el=document.createElement('div'); n.el.className='nt l'+n.l; n.el.style.left=(n.l*25)+'%'; n.el.textContent=DANCE_GLYPH[n.l]; dz.appendChild(n.el); }

    const now=performance.now(); let best=null;

    if(!best) continue;
    const d=Math.abs(best.at-now); best.done=true; if(best.el) best.el.remove();
    if(d<=80){ P++; score+=2; judge('완벽!','p'); } else { Gd++; score+=1; judge('좋아!','g'); }
    combo++; maxCombo=Math.max(maxCombo,combo); upd();
  }
  finished=true; for(const n of ns) if(!n.done){ M++; n.done=true; if(n.el) n.el.remove(); }
  const N=ns.length, pct=Math.round((2*P+Gd)/(2*N)*100), rank=pct>=95?'S':pct>=85?'A':pct>=70?'B':pct>=50?'C':'D';
  if(rank==='S'||rank==='A') sfx('perfect'); else sfx('win');
  w.innerHTML=`<h3>결과</h3><div class="res p">${pct}점 · 랭크 ${rank}</div><div class="help">완벽 ${P} · 좋아 ${Gd} · 놓침 ${M} · 최대 콤보 ${maxCombo}</div><div class="help">A를 눌러 계속</div>`;
  await sleep(300); await waitAB(); w.remove();
  if(MAP) playBgm((bAt(G.x,G.y)||{}).music||MAP.music);
  return {pct,rank,P,G:Gd,M,N,maxCombo};
}

function waitDir(ms){

}

      await say('(피망이 어디선가 꽃을 물어 와 엮더니, 작은 꽃 왕관을 만들었다.)');
    });
    await gotItem('pimancrown',1,'「피망의 꽃 왕관」을 손에 넣었다! (전설의 용사 기념)');
    await story([{t:'전설의 용사',c:'ch'},{t:'전설 장비 20 / 20',c:'ct'},'모든 전설 장비를 모았다!','네 사람(과 한 마리)의 이름은 오래오래 전해졌다고 한다.']);
  },
  async pimanNose(){
    const r=Math.random();
    const pick=r<.16?'legendstone':r<.42?'bigherb':r<.62?'ether':r<.8?'herb':null;
    sfx('chest');
    if(pick){ give(pick); toast(`피망이 킁킁! ${J(ITEMS[pick].name,'을/를')} 찾아 왔다!`,2400); }
    else { const g=R(30,90); G.gold+=g; toast(`피망이 킁킁! ${g}골드를 찾아 왔다!`,2400); }
  },
});

/* =========================================================
   저장 · 흐름
   ========================================================= */
function serialize(){
  return {v:1,map:G.map,x:G.x,y:G.y,dir:G.dir,gold:G.gold,inv:G.inv,flags:G.flags,time:Math.round(G.time),enh:G.enh,got:G.got,dex:G.dex,bk:G.bk,
    party:G.party.map(m=>({id:m.id,name:m.name,lv:m.lv,exp:m.exp,hp:m.hp,mp:m.mp,eq:m.eq,cls:m.cls}))};
}
function saveGame(){
  if(!G.started||!store(SKEY,serialize())) return false;
  try{ localStorage.setItem(SKEY+'-at',String(Date.now())); }catch(e){}
  cloudPush(); return true;
}
let autosaveWarned=false;
function autosave(){ if(!saveGame()&&!autosaveWarned){ autosaveWarned=true; toast('이 브라우저에서는 저장할 수 없어요.',2600); } }
function applySave(d){
  G.gold=d.gold; G.inv=d.inv||{}; G.flags=d.flags||{}; G.time=d.time||0; G.enh=d.enh||{}; G.got=d.got||{}; G.dex=d.dex||{}; G.bk=d.bk||{};
  G.party=d.party.map(p=>Object.assign({poison:false,guard:false},p)); G.night=false; applyLook();
  G.started=true; loadMap(d.map,d.x,d.y,d.dir);
}
async function gameOver(){
  stopBgm();
  if(F.lastTown==='star'){
    await story(['눈앞이 캄캄해졌다...','...','정신을 차려 보니 별빛 학원 기숙사 침대였다.'],{speed:1000});
    healAll(); G.night=false; loadMap('academy',26,7,'down'); G.mode='map'; await fade(0,400);
    await say('정신이 드니? 학생들이 너희를 업고 왔단다. 따뜻한 수프 먹고 기운 내렴!','식당 아주머니');
  } else if(F.lastTown==='city'){
    await story(['눈앞이 캄캄해졌다...','...','정신을 차려 보니 은방패 여관 침대였다.'],{speed:1000});
    healAll(); G.night=false; loadMap('city',8,5,'down'); G.mode='map'; await fade(0,400);
    await say('정신이 드세요? 기사님들이... 아니, 시민들이 여러분을 데려왔어요. 오늘은 공짜예요!','여관 주인');
  } else if(F.lastTown==='pine'){
    await story(['눈앞이 캄캄해졌다...','...','정신을 차려 보니 솔방울 여관 침대였다.'],{speed:1000});
    healAll(); G.night=false; loadMap('pine',26,5,'down'); G.mode='map'; await fade(0,400);
    await say('어머, 깨어났군요! 사냥꾼들이 쓰러져 있던 여러분을 데려왔어요. 오늘은 공짜예요. 무리하지 마세요!','여관 주인');
  } else {
    await story(['눈앞이 캄캄해졌다...','...','정신을 차려 보니 빵집 침대 옆이었다. 엄마가 걱정스러운 얼굴로 내려다보고 있다.'],{speed:1000});
    healAll(); G.night=false; loadMap('village',5,6,'up'); G.mode='map'; await fade(0,400);
    await say('세상에, 쓰러져 있었다니! 무리하지 말고, 힘들면 몬스터를 피해서 다니렴.','엄마');
  }
}
async function toTitle(){
  await fade(1,300); G.mode='title'; G.started=false; MAP=null; titleEl.hidden=false; playBgm('home'); await fade(0,300);
  titleMenu();
}
async function titleMenu(){
  G.mode='title'; titleEl.hidden=false; G.busy=true; playBgm('home');
  await cloudPull();
  const w=makeWin('w-title');
  for(;;){
    const has=!!load(SKEY);
    const c=await choose(w,[{label:'처음부터 시작'},{label:'이어하기',disabled:!has}],{start:has?1:0,cancel:false});
    if(c===0&&has){
      const w2=makeWin('w-center'); w2.style.zIndex=5;
      const r=await choose(w2,[{label:'새로 시작하기'},{label:'취소'}],{title:'기존 저장 기록을 덮어씁니다'}); w2.remove();
      if(r!==0) continue;
    }
    w.remove(); titleEl.hidden=true;
    if(c===0) return newGame();
    const d=load(SKEY);
    await fade(1,300); applySave(d); G.mode='map'; await fade(0,300); banner(MAP.name);
    G.busy=false; toast('목표: '+objective(),3200);
    if(F.ch1done&&!F.ch2) run(sc.ch2Start); else if(F.ch2done&&!F.ch3) run(sc.ch3Start); else if(F.ch3done&&!F.ch4) run(sc.ch4Start);
    return;
  }
}
async function newGame(){
  await fade(1,300);
  G.party=[]; G.inv={}; G.gold=0; G.flags={}; G.time=0; G.night=false; applyLook(); G.enh={}; G.got={}; G.dex={}; G.bk={}; G.started=true;
  G.party=[newMember('ruo',1)]; give('herb',2);
  stopBgm();
  await fade(0,10);
  await story(['밀빛 마을은 빵 냄새로 아침을 여는 작은 마을이다.','빵집 아들 루오의 꿈은 멋진 기사가 되는 것.','그런데 오늘 아침, 마을에서 빵 냄새 대신 탄 냄새가 났다.']);
  await chapterCard(1,'빵 냄새가 사라진 마을','잃어버린 재능을 되찾는 모험의 시작');
  loadMap('village',5,6,'up'); G.mode='map'; G.busy=true; await sleep(60); await fade(0,500);
  banner(MAP.name);
  G.busy=false;
  run(sc.opening);
}
const VN_SCENES={opening:1,kingScene:1,wake:1,rinaTalk:()=>cnt('moonherb')>=3,bossScene:1,altar:()=>!F.orb,ending:1,
  smith:()=>!F.sword,elder:()=>!F.speechQ||(F.speechQ===1&&[1,2,3,4].every(i=>F['sn'+i])),
  ch2Start:1,roman:()=>!F.romanTalk,izelMeet:1,izelLesson:1,campfire:1,raid:1,captive:1,crystal:1,chiliScene:1,ch2Ending:1,
  ch3Start:1,jayMeet:1,cityEnter:1,captain:1,arenaHost:1,tournament:1,innNight:1,burningNight:1,classChange:1,witchScene:1,ch3Ending:1,
  priest:1,hurtKnight:1,ch4Start:1,astra:()=>!F.exam||(F.broccoliDown&&!F.ch4a),broccoliScene:1,academyReturn:()=>!F.ch4a,greenEnter:()=>!F.greenSeen,hillEnter4:()=>!F.hill4Seen,seacap:1};
for(const k in VN_SCENES){ const f=sc[k], c=VN_SCENES[k]; if(!f) { console.warn('VN scene missing',k); continue; }
  sc[k]=function(...a){ return (c===1||c())?vnScene(()=>f.apply(sc,a)):f.apply(sc,a); }; }
function start(data){
  requestAnimationFrame(loop);
  if(data&&data.save){ applySave(data.save); G.mode='map'; G.busy=false; banner(MAP.name); if(F.ch1done&&!F.ch2) run(sc.ch2Start); else if(F.ch2done&&!F.ch3) run(sc.ch3Start); else if(F.ch3done&&!F.ch4) run(sc.ch4Start); return; }
  titleMenu();
}
try{ window.claude?.hot?.snapshot?.(()=>G.started&&G.mode!=='title'?{save:serialize()}:{}); }catch(e){}
const hot=window.claude?.hot;
if(hot?.ready) hot.ready(start); else start(hot?.data??{});
window.__ruo={getB:()=>B,say,LEGEND_IDS,legendCount,trialsN,breadGame,PIMAN_IMG,circleGame,playCouncil,VN,portraitURL,guessExpr,tSwirlOut,tMosaicIn,chapterCard,G,MAPS,sc,F,give,newMember,loadMap,st,encounter:(g,o)=>run(()=>encounter(g,o)),equipTo,cnt,run,bountyBoard,danceGame,fishingGame,SK,ITEMS,EN,CL,FISH,objective,TOWNS,useScroll,resetFol,EQUIP_IDS,swordGame,applyLook,warpTo:(...a)=>warpTo(...a),gainExp};
})();
