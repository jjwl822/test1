<!doctype html>
<html lang="ko">
<head><script src="/games/wv-fix.js?v=3"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>2048</title>
  <style>
    :root { --bg: #faf8ef; --fg: #4a4036; --muted: #8f8273; --grid: #bbada0; --empty: #cdc1b4; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b1814; --fg: #f2ebe2; --muted: #a99c8c; --grid: #4a4239; --empty: #5c5248; } }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overscroll-behavior: none;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; }
    main { max-width: 480px; height: 100%; margin: 0 auto; padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px); display: flex; flex-direction: column; gap: 14px; }
    header { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 22px; margin: 0; }
    .stats { display: flex; gap: 14px; color: var(--muted); }
    .stats b { color: var(--fg); font-size: 20px; font-variant-numeric: tabular-nums; }
    /* The whole play area takes swipes, so a swipe that starts a bit outside the board still counts. */
    .play { flex: 1; display: flex; flex-direction: column; gap: 14px; touch-action: none; }
    .board { position: relative; width: 100%; aspect-ratio: 1; background: var(--grid); border-radius: 14px; }
    .slot, .tile { position: absolute; left: 0; top: 0; border-radius: 8px; }
    .slot { background: var(--empty); }
    .tile { display: grid; place-items: center; font-weight: 800; color: #776e65; background: #eee4da;
      transition: transform .1s ease-in-out; will-change: transform; }
    .tile .face { width: 100%; height: 100%; display: grid; place-items: center; border-radius: 8px; background: inherit; }
    .tile.new .face { animation: appear .16s ease-out .08s backwards; }
    .tile.merged .face { animation: pop .16s ease-out .08s backwards; }
    .tile.merged { z-index: 2; }
    @keyframes appear { from { transform: scale(0); } }
    @keyframes pop { 0% { transform: scale(0); } 60% { transform: scale(1.18); } }
    .v2 { background: #eee4da; } .v4 { background: #ede0c8; }
    .v8 { background: #f2b179; color: #fff; } .v16 { background: #f59563; color: #fff; }
    .v32 { background: #f67c5f; color: #fff; } .v64 { background: #f65e3b; color: #fff; }
    .v128 { background: #edcf72; color: #fff; } .v256 { background: #edcc61; color: #fff; }
    .v512 { background: #edc850; color: #fff; } .v1024 { background: #edc53f; color: #fff; }
    .v2048 { background: #edc22e; color: #fff; box-shadow: 0 0 18px rgba(237,194,46,.7); }
    .vbig { background: #3c3a32; color: #fff; }
    .hint { text-align: center; color: var(--muted); font-size: 14px; margin: 0; }
    .buttons { display: flex; gap: 10px; }
    .buttons button { flex: 1; border: 0; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 700; background: rgba(128,128,128,.2); color: inherit; font-family: inherit; }
    .banner { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5; background: rgba(237,194,46,.95); color: #fff;
      font-weight: 800; font-size: 22px; padding: 14px 20px; border-radius: 14px; text-align: center; pointer-events: none; opacity: 0; transition: opacity .3s; }
    .banner.show { opacity: 1; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>🔢 2048</h1>
      <div class="stats"><span>점수 <b id="score">0</b></span><span>최고 <b id="max">2</b></span></div>
    </header>
    <div class="play" id="play">
      <div class="board" id="board"><div class="banner" id="banner">🎉 2048 달성!<br><small>계속해서 더 큰 숫자에 도전!</small></div></div>
      <p class="hint">화면을 위·아래·왼쪽·오른쪽으로 밀어요 · 하던 판은 자동 저장돼요</p>
    </div>
    <div class="buttons">
      <button id="restart">새 게임</button>
      <button id="quit">끝내고 기록 남기기</button>
    </div>
  </main>

  <script src="/games/family-games.js"></script>
  <script>
    const SAVE_KEY = 'game2048.save';
    const GAP_RATIO = 0.03; // gap between cells, relative to the board width
    const boardEl = document.getElementById('board');
    const playEl = document.getElementById('play');

    // grid[i] is the tile at cell i (row = i / 4, col = i % 4), or null.
    let grid = Array(16).fill(null), score = 0, playing = false, won = false, nextId = 1;
    const els = new Map(); // tile id -> element

    // Cell indexes of each line, listed in the order tiles slide toward.
    const LINES = { left: [], right: [], up: [], down: [] };
    for (let r = 0; r < 4; r++) {
      const row = [0, 1, 2, 3].map((c) => r * 4 + c);
      LINES.left.push(row);
      LINES.right.push([...row].reverse());
    }
    for (let c = 0; c < 4; c++) {
      const col = [0, 1, 2, 3].map((r) => r * 4 + c);
      LINES.up.push(col);
      LINES.down.push([...col].reverse());
    }

    // ---- Layout -----------------------------------------------------------------------------

    let cell = 0, gap = 0;
    function layout() {
      const w = boardEl.clientWidth;
      gap = Math.round(w * GAP_RATIO);
      cell = (w - gap * 5) / 4;
      boardEl.querySelectorAll('.slot').forEach((s) => s.remove());
      for (let i = 0; i < 16; i++) {
        const s = document.createElement('div');
        s.className = 'slot';
        place(s, i);
        boardEl.prepend(s);
      }
      for (const [id, el] of els) place(el, Number(el.dataset.pos));
    }
    function place(el, pos) {
      el.dataset.pos = pos;
      el.style.width = el.style.height = `${cell}px`;
      el.style.transform = `translate(${gap + (pos % 4) * (cell + gap)}px, ${gap + Math.floor(pos / 4) * (cell + gap)}px)`;
    }
    function fontSize(v) {
      return `${Math.round(cell * (v < 100 ? 0.48 : v < 1000 ? 0.4 : v < 10000 ? 0.31 : 0.25))}px`;
    }
    window.addEventListener('resize', layout);

    // ---- Tiles -------------------------------------------------------------------------------

    function makeTile(value, pos, kind) {
      const tile = { id: nextId++, value };
      const el = document.createElement('div');
      el.className = `tile v${value > 2048 ? 'big' : value}${kind ? ` ${kind}` : ''}`;
      el.innerHTML = `<div class="face">${value}</div>`;
      el.style.fontSize = fontSize(value);
      place(el, pos);
      boardEl.appendChild(el);
      els.set(tile.id, el);
      grid[pos] = tile;
      return tile;
    }

    function removeTile(tile, delay = 0) {
      const el = els.get(tile.id);
      els.delete(tile.id);
      if (delay) setTimeout(() => el?.remove(), delay);
      else el?.remove();
    }

    function addRandomTile() {
      const empty = grid.map((t, i) => (t ? -1 : i)).filter((i) => i >= 0);
      if (!empty.length) return;
      makeTile(Math.random() < 0.9 ? 2 : 4, empty[Math.floor(Math.random() * empty.length)], 'new');
    }

    function showStats() {
      document.getElementById('score').textContent = score.toLocaleString('ko-KR');
      document.getElementById('max').textContent = Math.max(2, ...grid.map((t) => t?.value ?? 0));
    }

    // ---- Moves -------------------------------------------------------------------------------

    function move(dir) {
      if (!playing) return false;
      const next = Array(16).fill(null);
      let changed = false;
      for (const line of LINES[dir]) {
        const tiles = line.filter((i) => grid[i]).map((i) => ({ tile: grid[i], from: i }));
        let k = 0;
        for (let j = 0; j < tiles.length; j++) {
          const a = tiles[j], b = tiles[j + 1];
          const target = line[k++];
          if (b && b.tile.value === a.tile.value) {
            // Both slide into the target cell, then a doubled tile pops up there.
            for (const t of [a, b]) {
              place(els.get(t.tile.id), target);
              removeTile(t.tile, 110);
            }
            next[target] = { merge: a.tile.value * 2 };
            score += a.tile.value * 2;
            changed = true;
            j++;
          } else {
            if (a.from !== target) {
              place(els.get(a.tile.id), target);
              changed = true;
            }
            next[target] = a.tile;
          }
        }
      }
      if (!changed) return false;
      grid = Array(16).fill(null);
      next.forEach((t, i) => {
        if (!t) return;
        if (t.merge) {
          const m = makeTile(t.merge, i, 'merged');
          if (m.value === 2048 && !won) celebrate();
        } else grid[i] = t;
      });
      addRandomTile();
      showStats();
      navigator.vibrate?.(8);
      save();
      if (!canMove()) {
        playing = false;
        clearSave();
        setTimeout(() => finish('더 움직일 수 없어요!'), 600);
      }
      return true;
    }

    function canMove() {
      for (let i = 0; i < 16; i++) {
        if (!grid[i]) return true;
        if (i % 4 < 3 && grid[i + 1] && grid[i].value === grid[i + 1].value) return true;
        if (i < 12 && grid[i + 4] && grid[i].value === grid[i + 4].value) return true;
      }
      return false;
    }

    function celebrate() {
      won = true;
      const b = document.getElementById('banner');
      b.classList.add('show');
      navigator.vibrate?.([30, 50, 30]);
      setTimeout(() => b.classList.remove('show'), 2500);
    }

    // ---- Input: exactly one move per swipe -----------------------------------------------------
    // Touch events with preventDefault (works the same on iPhone Safari and the Android app),
    // mouse via pointer events, and arrow keys. The move happens as soon as the finger has gone far
    // enough; the rest of that swipe is ignored, so one swipe can never move twice.

    const SWIPE = 24;
    let swipe = null; // { id, x, y, done }
    const dirOf = (dx, dy) => (Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : dy > 0 ? 'down' : 'up');

    function swipeStart(id, x, y) {
      swipe = { id, x, y, done: false };
    }
    function swipeMove(id, x, y) {
      if (!swipe || swipe.id !== id || swipe.done) return;
      const dx = x - swipe.x, dy = y - swipe.y;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE) return;
      swipe.done = true;
      move(dirOf(dx, dy));
    }
    function swipeEnd(id, x, y) {
      if (!swipe || swipe.id !== id) return;
      swipeMove(id, x, y); // a quick flick may end before any move event crossed the threshold
      swipe = null;
    }

    playEl.addEventListener('touchstart', (e) => {
      if (e.touches.length > 1) return (swipe = null);
      const t = e.changedTouches[0];
      swipeStart(`t${t.identifier}`, t.clientX, t.clientY);
    }, { passive: true });
    playEl.addEventListener('touchmove', (e) => {
      e.preventDefault(); // no page scroll / pull-to-refresh / back gesture while swiping
      const t = e.changedTouches[0];
      swipeMove(`t${t.identifier}`, t.clientX, t.clientY);
    }, { passive: false });
    playEl.addEventListener('touchend', (e) => {
      const t = e.changedTouches[0];
      swipeEnd(`t${t.identifier}`, t.clientX, t.clientY);
    });
    playEl.addEventListener('touchcancel', () => (swipe = null));

    playEl.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse') swipeStart('mouse', e.clientX, e.clientY);
    });
    window.addEventListener('pointermove', (e) => {
      if (e.pointerType === 'mouse') swipeMove('mouse', e.clientX, e.clientY);
    });
    window.addEventListener('pointerup', (e) => {
      if (e.pointerType === 'mouse') swipeEnd('mouse', e.clientX, e.clientY);
    });

    window.addEventListener('keydown', (e) => {
      const dir = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' }[e.key];
      if (dir) {
        e.preventDefault();
        if (!e.repeat) move(dir);
      }
    });

    // ---- Saving the game in progress -----------------------------------------------------------

    function save() {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({ cells: grid.map((t) => t?.value ?? 0), score, won }));
      } catch {}
    }
    function clearSave() {
      try {
        localStorage.removeItem(SAVE_KEY);
      } catch {}
    }
    function loadSave() {
      try {
        const s = JSON.parse(localStorage.getItem(SAVE_KEY));
        if (s && Array.isArray(s.cells) && s.cells.length === 16 && s.cells.some(Boolean)) return s;
      } catch {}
      return null;
    }

    // ---- Game flow -----------------------------------------------------------------------------

    function clearBoard() {
      for (const id of [...els.keys()]) removeTile({ id });
      grid = Array(16).fill(null);
    }

    function newGame() {
      clearBoard();
      score = 0;
      won = false;
      addRandomTile();
      addRandomTile();
      playing = true;
      showStats();
      save();
    }

    function resume(s) {
      clearBoard();
      s.cells.forEach((v, i) => v && makeTile(v, i));
      score = Number(s.score) || 0;
      won = Boolean(s.won);
      playing = true;
      showStats();
      if (!canMove()) {
        playing = false;
        clearSave();
        setTimeout(() => finish('더 움직일 수 없어요!'), 300);
      }
    }

    function finish(reason) {
      playing = false;
      clearSave();
      const top = Math.max(...grid.map((t) => t?.value ?? 0));
      FamilyGames.finish(score, `${reason}\n점수 ${score.toLocaleString('ko-KR')}점 · 최고 타일 ${top}`);
    }

    // Two-tap buttons instead of confirm(): the Android app's game screen can't show dialogs.
    function twoTap(button, label, armedLabel, action) {
      let armed = null;
      button.addEventListener('click', () => {
        if (!playing) return;
        if (armed) {
          clearTimeout(armed);
          armed = null;
          button.textContent = label;
          action();
          return;
        }
        button.textContent = armedLabel;
        armed = setTimeout(() => {
          armed = null;
          button.textContent = label;
        }, 3000);
      });
    }
    twoTap(document.getElementById('quit'), '끝내고 기록 남기기', '한 번 더 누르면 끝나요', () => finish('수고했어요!'));
    twoTap(document.getElementById('restart'), '새 게임', '한 번 더 누르면 새 판', () => {
      if (score > 0) FamilyGames.submitScore(score); // the old game still counts
      newGame();
    });

    layout();
    const saved = loadSave();
    if (saved) resume(saved);
    else newGame();
    playing = false;
    FamilyGames.setup({
      title: '2048', emoji: '🔢',
      howTo: saved
        ? `하던 판이 있어요 (점수 ${Number(saved.score).toLocaleString('ko-KR')}점).\n이어서 해 보세요!`
        : '화면을 밀면 숫자 타일이 한쪽으로 모여요.\n같은 숫자가 만나면 합쳐져요. 2048을 만들어 보세요!\n하던 판은 자동으로 저장돼요.',
      startLabel: saved ? '이어하기' : '시작!',
      onStart: () => {
        // "한 번 더" after a finished game starts fresh; otherwise continue the board on screen.
        if (!grid.some(Boolean) || !canMove() || !loadSave()) newGame();
        else playing = true;
      },
    });
  </script>
</body>
</html>
