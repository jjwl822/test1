<!doctype html>
<html lang="ko">
<head><script src="/games/wv-fix.js?v=3"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>반응속도</title>
  <style>
    :root { --bg: #f4f8ff; --fg: #222; --muted: #7a8494; }
    @media (prefers-color-scheme: dark) { :root { --bg: #11151c; --fg: #eef2f8; --muted: #93a0b4; } }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overscroll-behavior: none; touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; user-select: none; -webkit-user-select: none; }
    main { max-width: 480px; height: 100%; margin: 0 auto; padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px); display: flex; flex-direction: column; gap: 14px; }
    header { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 22px; margin: 0; }
    .stats { display: flex; gap: 14px; color: var(--muted); }
    .stats b { color: var(--fg); font-size: 20px; font-variant-numeric: tabular-nums; }
    .pad { flex: 1; border: 0; border-radius: 24px; color: #fff; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 10px; font-family: inherit; background: #8e8e93; transition: background .08s; }
    .pad.wait { background: #ff3b30; }
    .pad.go { background: #34c759; }
    .pad.early { background: #ff9500; }
    .pad.result { background: #007aff; }
    .pad big { font-size: clamp(34px, 11vw, 54px); font-weight: 800; }
    .pad small { font-size: 17px; opacity: .9; }
    .times { display: flex; gap: 8px; justify-content: center; min-height: 34px; flex-wrap: wrap; }
    .times span { background: rgba(128,128,128,.15); border-radius: 999px; padding: 6px 12px; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>⚡ 반응속도</h1>
      <div class="stats"><span>라운드 <b id="round">0</b>/5</span></div>
    </header>
    <button class="pad" id="pad"><big id="big">준비</big><small id="small"></small></button>
    <div class="times" id="times"></div>
  </main>

  <script src="/games/family-games.js"></script>
  <script>
    const ROUNDS = 5;
    const pad = document.getElementById('pad');
    let state = 'idle', times = [], goAt = 0, timer = null;

    function show(cls, big, small = '') {
      pad.className = `pad ${cls}`;
      document.getElementById('big').textContent = big;
      document.getElementById('small').textContent = small;
    }

    function renderTimes() {
      document.getElementById('round').textContent = times.length;
      document.getElementById('times').innerHTML = times.map((t) => `<span>${t}ms</span>`).join('');
    }

    function next() {
      state = 'wait';
      show('wait', '기다리세요…', '초록색이 되면 바로 터치!');
      timer = setTimeout(() => {
        state = 'go';
        goAt = performance.now();
        show('go', '지금!');
      }, 1200 + Math.random() * 2800);
    }

    function verdict(ms) {
      if (ms < 250) return '번개 같아요 ⚡';
      if (ms < 330) return '아주 빨라요 👍';
      if (ms < 450) return '좋아요 🙂';
      return '조금 더 집중! 💪';
    }

    pad.addEventListener('pointerdown', () => {
      if (state === 'wait') {
        clearTimeout(timer);
        state = 'early';
        show('early', '너무 빨라요! 😅', '터치하면 이 라운드를 다시 해요');
      } else if (state === 'early' || state === 'between') {
        next();
      } else if (state === 'go') {
        const ms = Math.round(performance.now() - goAt);
        times.push(ms);
        renderTimes();
        navigator.vibrate?.(15);
        if (times.length === ROUNDS) {
          state = 'done';
          const avg = Math.round(times.reduce((a, b) => a + b, 0) / ROUNDS);
          show('result', `${ms}ms`, `평균 ${avg}ms`);
          setTimeout(() => FamilyGames.finish(avg, `${ROUNDS}번 평균 ${avg}ms!\n${verdict(avg)}`), 700);
        } else {
          state = 'between';
          show('result', `${ms}ms`, '터치하면 다음 라운드');
        }
      }
    });

    function start() {
      clearTimeout(timer);
      times = [];
      renderTimes();
      next();
    }

    FamilyGames.setup({
      title: '반응속도', emoji: '⚡',
      howTo: '빨간 화면이 초록색으로 바뀌는 순간 터치!\n5번 평균이 빠를수록 1등이에요.\n너무 일찍 누르면 그 라운드는 다시 해요.',
      onStart: start,
    });
  </script>
</body>
</html>
