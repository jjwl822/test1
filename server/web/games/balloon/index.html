<!doctype html>
<html lang="ko">
<head><script src="/games/wv-fix.js?v=3"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>풍선 터뜨리기</title>
  <style>
    :root { --bg: #eaf6ff; --fg: #222; --muted: #6f8294; --sky: linear-gradient(#bfe6ff, #f2fbff); }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f1722; --fg: #eef2f8; --muted: #93a0b4; --sky: linear-gradient(#0d2238, #1a3350); } }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overscroll-behavior: none; touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; user-select: none; -webkit-user-select: none; }
    main { max-width: 480px; height: 100%; margin: 0 auto; padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px); display: flex; flex-direction: column; gap: 12px; }
    header { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 22px; margin: 0; }
    .stats { display: flex; gap: 14px; color: var(--muted); }
    .stats b { color: var(--fg); font-size: 20px; font-variant-numeric: tabular-nums; }
    .bar { height: 8px; border-radius: 4px; background: rgba(0,0,0,.1); overflow: hidden; }
    .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #34c759, #ffcc00, #ff3b30); }
    .sky { flex: 1; position: relative; overflow: hidden; border-radius: 20px; background: var(--sky); touch-action: none; }
    .balloon { position: absolute; left: 0; top: 0; font-size: 54px; line-height: 1; padding: 6px; will-change: transform; }
    .boom { position: absolute; font-size: 40px; pointer-events: none; animation: boom .35s forwards; }
    .boom b { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); font-size: 18px; color: #ff3040; }
    @keyframes boom { from { transform: scale(.6); } to { transform: scale(1.4); opacity: 0; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>🎈 풍선 터뜨리기</h1>
      <div class="stats"><span>터뜨린 <b id="score">0</b></span><span><b id="left">30</b>초</span></div>
    </header>
    <div class="bar"><i id="bar"></i></div>
    <div class="sky" id="sky"></div>
  </main>

  <script src="/games/family-games.js"></script>
  <script>
    const SECONDS = 30;
    const sky = document.getElementById('sky');
    let balloons = [], score = 0, endAt = 0, running = false, last = 0, nextSpawn = 0;

    function spawn(now, progress) {
      const gift = Math.random() < 0.08;
      const el = document.createElement('div');
      el.className = 'balloon';
      el.textContent = gift ? '🎁' : '🎈';
      if (!gift) el.style.filter = `hue-rotate(${Math.floor(Math.random() * 360)}deg)`;
      const w = sky.clientWidth, h = sky.clientHeight;
      const b = {
        el,
        x: Math.random() * (w - 66),
        y: h + 10,
        // Faster near the end; gifts are quicker but worth 3.
        speed: (h / (3.6 - progress * 1.6)) * (gift ? 1.4 : 0.85 + Math.random() * 0.3),
        wobble: Math.random() * Math.PI * 2,
        points: gift ? 3 : 1,
      };
      // Fingers via touch events (same on iPhone Safari and the Android app), the mouse via pointer events.
      el.addEventListener('touchstart', (e) => {
        e.preventDefault();
        pop(b);
      }, { passive: false });
      el.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse') pop(b);
      });
      sky.appendChild(el);
      balloons.push(b);
    }

    function pop(b) {
      if (!running || b.popped) return;
      b.popped = true;
      score += b.points;
      document.getElementById('score').textContent = score;
      navigator.vibrate?.(12);
      const boom = document.createElement('div');
      boom.className = 'boom';
      boom.innerHTML = `💥<b>+${b.points}</b>`;
      boom.style.left = `${b.x + 6}px`;
      boom.style.top = `${b.y + 4}px`;
      sky.appendChild(boom);
      setTimeout(() => boom.remove(), 350);
      b.el.remove();
    }

    function frame(now) {
      if (!running) return;
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      const left = Math.max(0, endAt - Date.now());
      const progress = 1 - left / (SECONDS * 1000);
      document.getElementById('left').textContent = Math.ceil(left / 1000);
      document.getElementById('bar').style.width = `${(left / (SECONDS * 1000)) * 100}%`;
      if (now >= nextSpawn) {
        spawn(now, progress);
        nextSpawn = now + 520 - progress * 280;
      }
      for (const b of balloons) {
        if (b.popped) continue;
        b.y -= b.speed * dt;
        b.wobble += dt * 3;
        b.el.style.transform = `translate(${b.x + Math.sin(b.wobble) * 8}px, ${b.y}px)`;
        if (b.y < -80) {
          b.popped = true;
          b.el.remove();
        }
      }
      balloons = balloons.filter((b) => !b.popped);
      if (left === 0) return finish();
      requestAnimationFrame(frame);
    }

    function start() {
      sky.innerHTML = '';
      balloons = [];
      score = 0;
      document.getElementById('score').textContent = '0';
      endAt = Date.now() + SECONDS * 1000;
      running = true;
      last = performance.now();
      nextSpawn = last;
      requestAnimationFrame(frame);
    }

    function finish() {
      running = false;
      FamilyGames.finish(score, `풍선 ${score}점! 🎈`);
    }

    FamilyGames.setup({
      title: '풍선 터뜨리기', emoji: '🎈',
      howTo: `${SECONDS}초 동안 올라오는 풍선을 톡톡 터뜨려요.\n🎈 1점, 🎁 선물은 3점!`,
      onStart: start,
    });
  </script>
</body>
</html>
