<!doctype html>
<html lang="ko">
<head><script src="/games/wv-fix.js?v=3"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>순서 기억하기</title>
  <style>
    :root { --bg: #f5f5f7; --fg: #222; --muted: #7a7a85; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111114; --fg: #eeeef2; --muted: #9a9aa6; } }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overscroll-behavior: none; touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; user-select: none; -webkit-user-select: none; }
    main { max-width: 480px; height: 100%; margin: 0 auto; padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px); display: flex; flex-direction: column; gap: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 22px; margin: 0; }
    .stats { display: flex; gap: 14px; color: var(--muted); }
    .stats b { color: var(--fg); font-size: 20px; font-variant-numeric: tabular-nums; }
    .msg { text-align: center; font-size: 20px; font-weight: 800; min-height: 28px; }
    .pads { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; aspect-ratio: 1; width: 100%; max-width: 420px; margin: 0 auto; }
    .pad { border: 0; border-radius: 28px; font-size: clamp(40px, 14vw, 64px); opacity: .45; transition: opacity .08s, transform .08s;
      box-shadow: 0 4px 0 rgba(0,0,0,.18); }
    .pad.lit { opacity: 1; transform: scale(1.04); box-shadow: 0 0 28px currentColor; }
    .pad.red { background: #ff3b30; color: #ff3b30; } .pad.blue { background: #007aff; color: #007aff; }
    .pad.green { background: #34c759; color: #34c759; } .pad.yellow { background: #ffcc00; color: #ffcc00; }
    .pad span { filter: none; }
    .pads.locked .pad { pointer-events: none; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>🎵 순서 기억하기</h1>
      <div class="stats"><span>단계 <b id="score">0</b></span></div>
    </header>
    <div class="msg" id="msg"></div>
    <div class="pads locked" id="pads">
      <button class="pad red" data-i="0"><span>🍓</span></button>
      <button class="pad blue" data-i="1"><span>🐳</span></button>
      <button class="pad green" data-i="2"><span>🐸</span></button>
      <button class="pad yellow" data-i="3"><span>🌻</span></button>
    </div>
  </main>

  <script src="/games/family-games.js"></script>
  <script>
    const TONES = [329.6, 261.6, 392.0, 196.0];
    const padsEl = document.getElementById('pads');
    const pads = [...padsEl.children];
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    let seq = [], pos = 0, playing = false, audio = null;

    function beep(i, ms) {
      try {
        audio ??= new (window.AudioContext || window.webkitAudioContext)();
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.frequency.value = TONES[i];
        osc.type = 'triangle';
        gain.gain.setValueAtTime(0.25, audio.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + ms / 1000);
        osc.connect(gain).connect(audio.destination);
        osc.start();
        osc.stop(audio.currentTime + ms / 1000);
      } catch {}
    }

    async function light(i, ms) {
      pads[i].classList.add('lit');
      beep(i, ms);
      await wait(ms);
      pads[i].classList.remove('lit');
    }

    const msg = (t) => (document.getElementById('msg').textContent = t);

    async function showSequence() {
      padsEl.classList.add('locked');
      msg('잘 보세요 👀');
      await wait(600);
      const ms = Math.max(260, 560 - seq.length * 22);
      for (const i of seq) {
        if (!playing) return;
        await light(i, ms);
        await wait(ms * 0.45);
      }
      pos = 0;
      msg('따라 눌러요! 👆');
      padsEl.classList.remove('locked');
    }

    function nextRound() {
      seq.push(Math.floor(Math.random() * 4));
      showSequence();
    }

    pads.forEach((pad, i) =>
      pad.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (!playing || padsEl.classList.contains('locked')) return;
        light(i, 220);
        if (seq[pos] !== i) return fail();
        pos++;
        if (pos === seq.length) {
          document.getElementById('score').textContent = seq.length;
          padsEl.classList.add('locked');
          msg('잘했어요! ✨');
          navigator.vibrate?.(15);
          setTimeout(nextRound, 700);
        }
      }),
    );

    function fail() {
      playing = false;
      padsEl.classList.add('locked');
      navigator.vibrate?.(120);
      const done = seq.length - 1;
      msg(`앗! 정답은 ${pads[seq[pos]].textContent.trim()} 였어요`);
      pads[seq[pos]].classList.add('lit');
      setTimeout(() => {
        pads.forEach((p) => p.classList.remove('lit'));
        FamilyGames.finish(done, `${done}단계까지 기억했어요! 🎵`);
      }, 1200);
    }

    function start() {
      seq = [];
      playing = true;
      document.getElementById('score').textContent = '0';
      nextRound();
    }

    FamilyGames.setup({
      title: '순서 기억하기', emoji: '🎵',
      howTo: '불이 켜지는 순서를 잘 보고 똑같이 눌러요.\n한 단계마다 하나씩 늘어나요.\n소리를 켜면 더 쉬워요! 🔊',
      onStart: start,
    });
  </script>
</body>
</html>
